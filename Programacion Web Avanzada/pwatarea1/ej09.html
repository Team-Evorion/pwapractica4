<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería de Pasatiempos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            padding: 30px;
            text-align: center;
        }
        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .gallery img {
            width: 220px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .gallery img:hover { transform: scale(1.05); }

        /* Modal / Ventana emergente */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            color: white; font-size: 30px; cursor: pointer;
        }
        a { display: inline-block; margin-top: 25px; color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>

    <h2>Galería de Pasatiempos</h2>
    <p>Haz clic en cualquiera de las imágenes para desplegarla en ventana emergente.</p>

    <div class="gallery">
        <img src="https://picsum.photos/id/0/400/300" alt="Programación" onclick="openModal(this.src)">
        <img src="https://picsum.photos/id/111/400/300" alt="Motocicletas" onclick="openModal(this.src)">
        <img src="https://picsum.photos/id/96/400/300" alt="Videojuegos" onclick="openModal(this.src)">
    </div>

    <!-- Estructura de la ventana emergente -->
    <div id="modalBox" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img id="modalImg" src="" alt="Ampliación">
    </div>

    <br>
    <a href="index.html">&larr; Volver al Menú Principal</a>

    <script>
        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalBox').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modalBox').style.display = 'none';
        }
    </script>
</body>
</html>
