<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Enlaces y Listas</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            background: #eef2f5;
            padding: 40px 20px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        h2 { color: #003366; }
        ul { line-height: 1.8; }
        a.social-btn {
            display: inline-block;
            background-color: #1877f2;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .back-link { display: block; margin-top: 20px; color: #555; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Mi Red Social Favorita</h2>
        <p>Visita mi perfil o plataforma favorita:</p>
        <a href="https://github.com" target="_blank" class="social-btn">Mi Perfil en GitHub</a>

        <h2>Mis Pasatiempos</h2>
        <ul>
            <li>Programación y desarrollo de software</li>
            <li>Conducción y mecánica de motocicletas</li>
            <li>Videojuegos de simulador y estrategia en PC</li>
        </ul>

        <a href="index.html" class="back-link">&larr; Volver al Menú</a>
    </div>
</body>
</html>
